spring.application.name=api-gateway
server.port=8080
spring.profile.active=dev


# Automatically discovers metadata and public keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost:8081
data.redis.port: localhost:6371



# Eureka Service Registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Gateway Routes - Account Service
spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accounts/**


# Rate Limiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1


# Circuit Breaker
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.name=accountCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.fallbackUri=forward:/fallback/accounts

# Gateway Routes - Transaction Service
spring.cloud.gateway.server.webflux.routes[1].id=transaction-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transactions/**


# Rate Limiter - Transaction Service
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.requestedTokens=1


# By default, only 'health' is exposed over HTTP. 
# Explicitly include health, info, and prometheus:
management.endpoints.web.exposure.include=health,info,prometheus