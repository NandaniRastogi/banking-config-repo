```yaml
server:
  port: 8081

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

  cloud:
    gateway:
      routes:

        # ==========================================
        # ACCOUNT SERVICE
        # ==========================================
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/accounts

        # ==========================================
        # TRANSACTION SERVICE
        # ==========================================
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # ==========================================
        # AUTH SERVICE
        # ==========================================
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/oauth2/**,/public/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

# ==========================================
# EUREKA CLIENT
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ==========================================
# ACTUATOR & MONITORING
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"

  otlp:
    metrics:
      export:
        enabled: false
```
