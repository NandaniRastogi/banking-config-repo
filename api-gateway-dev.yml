server:
  port: 8081

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6371
  security:
    oauth2:
      resourceserver:
        jwt:
          # Automatically discovers metadata and public keys
          issuer-uri: https://localhost:9000
  cloud:
    gateway:
      routes:
        # Gateway Routes - Account Service
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            # Rate Limiter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
            # Circuit Breaker
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/accounts

        # Gateway Routes - Transaction Service
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
          filters:
            # Rate Limiter - Transaction Service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # Gateway Routes - Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/oauth2/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        # By default, only 'health' is exposed over HTTP.
        # Explicitly include health, info, and prometheus:
        include: "health,info,prometheus"
