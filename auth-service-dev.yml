spring:
  application:
    name: auth-service
  
  # ==========================================
  # POSTGRESQL DATA SOURCE CONFIGURATION
  # ==========================================
  datasource:
    # The standard JDBC connection URL. Replace 'localhost:5432' with your host and 'mydb' with your database name.
    url: jdbc:postgresql://localhost:5432/auth_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  
  # ==========================================
  # JPA / HIBERNATE CONFIGURATION
  # ==========================================
  jpa:
    # Controls database schema generation. Options: none, validate, update, create, create-drop
    # 'update' is ideal for development; use 'validate' or 'none' for production.
    hibernate:
      ddl-auto: validate
    
    # Optional: Set to true to print generated SQL statements in the console (great for debugging)
    show-sql: true
    
    properties:
      hibernate:
        # Tells Hibernate to use the PostgreSQL dialect for SQL optimization
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration

server:
  port: 9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
